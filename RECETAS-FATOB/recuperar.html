<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - RECETAS FATOB</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/tienda.css">
    <link rel="icon" href="img/favicon.jpg">
</head>
<body>
    <div id="nav"></div>

    <main class="auth">
        <section class="auth-card">
            <h1>¿Olvidaste tu contraseña?</h1>
            <p class="sub" id="subRecuperar">Ingresá tu correo para crear una nueva contraseña.</p>
            <div id="aviso"></div>
            <form class="auth-form" id="formRecuperar" novalidate>
                <div class="campo"><input type="email" id="email" placeholder="Correo Electrónico" aria-label="Correo electrónico" required></div>
                <button type="submit" class="btn">Continuar</button>
            </form>
            <form class="auth-form" id="formNueva" style="display:none" novalidate>
                <div class="campo"><input type="password" id="contrasena" placeholder="Nueva contraseña" aria-label="Nueva contraseña" required></div>
                <div class="campo"><input type="password" id="verificar" placeholder="Repetir contraseña" aria-label="Repetir contraseña" required></div>
                <label class="check"><input type="checkbox" data-mostrar="contrasena,verificar"> Mostrar contraseña</label>
                <button type="submit" class="btn">Guardar contraseña</button>
            </form>
            <p class="auth-pie"><a href="login.html">Volver a iniciar sesión</a></p>
        </section>
    </main>

    <div id="pie"></div>

    <script src="js/datos.js"></script>
    <script data-src="js/componentes.js"></script>
    <script data-src="js/navbar.js"></script>
    <script data-src="js/backtotop.js"></script>
    <script data-src="js/auth.js"></script>
    <script data-src="js/cuenta.js"></script>
</body>
</html>
