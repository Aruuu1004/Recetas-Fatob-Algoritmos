<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - RECETAS FATOB</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/tienda.css">
    <link rel="icon" href="img/favicon.jpg">
</head>
<body>
    <div id="nav"></div>

    <main class="auth">
        <section class="auth-card">
            <h1>¡Bienvenido!</h1>
            <p class="sub">Iniciá sesión para seguir cocinando.</p>
            <div id="aviso"></div>
            <form class="auth-form" id="formLogin" novalidate>
                <div class="campo"><input type="email" id="email" placeholder="Correo Electrónico" aria-label="Correo electrónico" autocomplete="email" required></div>
                <div class="campo"><input type="password" id="contrasena" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required></div>
                <label class="check"><input type="checkbox" data-mostrar="contrasena"> Mostrar contraseña</label>
                <button type="submit" class="btn">Iniciar Sesión</button>
            </form>
            <a class="auth-olvido" href="recuperar.html">¿Olvidaste tu contraseña?</a>
            <p class="auth-pie">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
        </section>
    </main>

    <div id="pie"></div>

    <script src="js/datos.js"></script>
    <script data-src="js/componentes.js"></script>
    <script data-src="js/navbar.js"></script>
    <script data-src="js/backtotop.js"></script>
    <script data-src="js/auth.js"></script>
    <script data-src="js/cuenta.js"></script>
</body>
</html>
